# Builds cpuminer-opt-rin for four platforms and collects the results in a
# draft release. Start it by hand: Actions -> Release -> Run workflow.
#
# The draft gets the tag v<version in configure.ac>-rin.<short commit>. No tag
# is pushed: GitHub creates it on the built commit when the draft is published.
# Starting the workflow again for the same commit replaces the draft.

name: Release

on:
  workflow_dispatch:
  # TEMPORARY while the workflow is being developed: build and test on every
  # push to the scratch branch, without creating a release.
  push:
    branches: [ ci/release-workflow ]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # One binary with the whole miner compiled for four CPU levels (SSE2,
  # SSE4.2, AVX2, AVX-512); it picks one when it starts. See
  # build-multiarch.sh.
  linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-12 g++-12 autoconf automake \
               libcurl4-openssl-dev libjansson-dev libgmp-dev zlib1g-dev
      - name: Build
        run: |
          # Link jansson and gmp statically: only libcurl and the C and C++
          # runtime remain as shared library dependencies.
          mkdir static
          cp /usr/lib/x86_64-linux-gnu/libgmp.a /usr/lib/x86_64-linux-gnu/libjansson.a static/
          CC=gcc-12 CXX=g++-12 \
          CONFIGURE_ARGS="--with-curl LDFLAGS=-L$PWD/static" ./build-multiarch.sh
          strip -s build-multiarch/cpuminer
      - name: Test
        run: |
          grep -m1 'model name' /proc/cpuinfo
          # Level 4 objects can only run here if the runner has AVX-512.
          ALLOW_ILLEGAL=1 test/ci-check.sh build-multiarch/cpuminer \
             build-multiarch/l1 build-multiarch/l2 build-multiarch/l3 build-multiarch/l4
          ldd build-multiarch/cpuminer
      - name: Package
        run: test/ci-package.sh linux-x86_64 build-multiarch/cpuminer
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*
          if-no-files-found: error

  linux-arm64:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake \
               libcurl4-openssl-dev libjansson-dev libgmp-dev zlib1g-dev
      - name: Build
        run: |
          mkdir static
          cp /usr/lib/aarch64-linux-gnu/libgmp.a /usr/lib/aarch64-linux-gnu/libjansson.a static/
          ./autogen.sh
          # Baseline ARMv8-A: NEON, no crypto extensions, so that boards
          # like the Raspberry Pi 4 can run it.
          ./configure CFLAGS="-O3 -march=armv8-a -Wall" LDFLAGS="-L$PWD/static" --with-curl
          make -j "$(nproc)"
      - name: Test
        run: |
          grep -m1 -i 'model name\|CPU part' /proc/cpuinfo || true
          test/ci-check.sh ./cpuminer .
          ldd ./cpuminer
      - name: Package
        run: |
          strip -s cpuminer
          test/ci-package.sh linux-arm64 cpuminer
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: dist/*
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install autoconf automake libtool gmp jansson
      - name: Build
        run: |
          mkdir static
          cp "$(brew --prefix gmp)/lib/libgmp.a" "$(brew --prefix jansson)/lib/libjansson.a" static/
          ./autogen.sh
          ./configure CFLAGS="-O3 -mcpu=apple-m1 -Wall" LDFLAGS="-L$PWD/static" --with-curl
          make -j "$(sysctl -n hw.ncpu)"
      - name: Test
        run: |
          sysctl -n machdep.cpu.brand_string
          test/ci-check.sh ./cpuminer .
          otool -L ./cpuminer
      - name: Package
        run: |
          strip cpuminer
          test/ci-package.sh macos-arm64 cpuminer
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*
          if-no-files-found: error

  # Same multi-level binary as on Linux, built with MinGW-w64 under MSYS2.
  windows-x86_64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Keep line endings as they are
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel autoconf automake zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-jansson
            mingw-w64-ucrt-x86_64-gmp
      - name: Build
        run: |
          mkdir static
          cp /ucrt64/lib/libgmp.a /ucrt64/lib/libjansson.a static/
          CONFIGURE_ARGS="--with-curl LDFLAGS=-L$PWD/static" ./build-multiarch.sh
          strip -s build-multiarch/cpuminer.exe
      - name: Test
        run: |
          ALLOW_ILLEGAL=1 test/ci-check.sh build-multiarch/cpuminer.exe \
             build-multiarch/l1 build-multiarch/l2 build-multiarch/l3 build-multiarch/l4
      - name: Package
        run: test/ci-package.sh windows-x86_64 build-multiarch/cpuminer.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: [ linux-x86_64, linux-arm64, macos-arm64, windows-x86_64 ]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(test/ci-package.sh --tag)
          cd dist
          sha256sum cpuminer-opt-rin-* > SHA256SUMS
          cat SHA256SUMS
          {
            echo "cpuminer-opt-rin $tag, built from commit $GITHUB_SHA."
            echo
            echo "| Download | System | Contents |"
            echo "|---|---|---|"
            echo "| \`cpuminer-opt-rin-$tag-linux-x86_64.tar.gz\` | Linux, x86-64, glibc 2.35 or newer | one binary for every CPU from SSE2 to AVX-512 |"
            echo "| \`cpuminer-opt-rin-$tag-windows-x86_64.zip\` | Windows 10 or newer, x86-64 | one binary for every CPU from SSE2 to AVX-512, with the DLLs it needs |"
            echo "| \`cpuminer-opt-rin-$tag-linux-arm64.tar.gz\` | Linux, ARM64, glibc 2.35 or newer | ARMv8-A with NEON |"
            echo "| \`cpuminer-opt-rin-$tag-macos-arm64.tar.gz\` | macOS on Apple Silicon | Apple M1 and newer |"
            echo
            echo "The x86-64 binaries contain the miner four times, compiled for SSE2, SSE4.2, AVX2 and AVX-512, and use the best one the CPU supports. The first line they print says which."
            echo
            echo "The Linux binaries need \`libcurl.so.4\`. On macOS remove the download quarantine first: \`xattr -d com.apple.quarantine cpuminer\`."
            echo
            echo "\`SHA256SUMS\` lists the checksums of the archives."
          } > ../notes.md
          # A draft of the same commit from an earlier run is replaced.
          if gh release view "$tag" --json isDraft --jq .isDraft 2> /dev/null | grep -q true; then
             gh release delete "$tag" --yes
          fi
          gh release create "$tag" --draft --target "$GITHUB_SHA" \
             --title "cpuminer-opt-rin $tag" --notes-file ../notes.md \
             cpuminer-opt-rin-* SHA256SUMS
